<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LATAM Bank · Account &amp; Payments Assistant</title>
<link rel="icon" href="data:,">
<style>
  :root {
    --bg:#f4f5f3; --panel:#ffffff; --ink:#1b1f1d; --muted:#5d645f; --line:#dfe3de; --soft:#eef1ed;
    --accent:#0e5c55; --accent-ink:#ffffff; --focus:#2f6fed;
    --ok:#1b7a47; --clarify:#4a4fb5; --abstain:#935700; --escalate:#b3261e; --reauth:#5d645f;
    --code:#f1f3f0;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#101312; --panel:#191d1b; --ink:#e7ebe8; --muted:#9aa39d; --line:#2b312e; --soft:#212624;
            --accent:#58c1b3; --accent-ink:#0b1614; --focus:#8fb2ff;
            --ok:#3fb477; --clarify:#8d91f0; --abstain:#e0a33e; --escalate:#ef6b62; --reauth:#9aa39d; --code:#222826; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  button, input, select { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  [hidden] { display: none !important; }
  code, .mono { font-family: ui-monospace, "Cascadia Mono", Consolas, monospace; font-size: 13px; }

  .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
         max-width: 1480px; margin: 0 auto; padding: 18px 16px 6px; }
  .brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 40px; height: 40px; border-radius: 10px; background: var(--accent); color: var(--accent-ink);
          display: grid; place-items: center; font-weight: 700; letter-spacing: .5px; flex: none; }
  h1 { font-size: 19px; margin: 0; line-height: 1.25; }
  .sub { margin: 2px 0 0; color: var(--muted); font-size: 13px; }
  .top-actions { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .pill { font-size: 12px; padding: 3px 10px; border-radius: 99px; border: 1px solid var(--line); background: var(--panel); color: var(--muted); }
  .pill.warn { color: var(--abstain); border-color: currentColor; }
  .pill.down { color: var(--escalate); border-color: currentColor; }
  .lang { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .lang button { border: 0; background: var(--panel); padding: 4px 10px; cursor: pointer; font-size: 13px; }
  .lang button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); }
  .promise { max-width: 1480px; margin: 4px auto 0; padding: 0 16px; color: var(--muted); font-size: 13.5px; }

  .layout { display: grid; grid-template-columns: 310px minmax(0, 1fr) 390px; gap: 16px; align-items: start;
            max-width: 1480px; margin: 0 auto; padding: 14px 16px 32px; }
  .layout.plain { grid-template-columns: minmax(0, 760px); justify-content: center; }
  @media (min-width: 1201px) { .scen, .bank { position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow-y: auto; padding-right: 2px; } }
  @media (max-width: 1200px) { .layout { grid-template-columns: 290px minmax(0, 1fr); } .bank { grid-column: 1 / -1; } }
  @media (max-width: 780px) { .layout { grid-template-columns: minmax(0, 1fr); } }
  .col h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 2px 0 6px; }
  .hint { color: var(--muted); font-size: 13px; margin: 0 0 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px; }

  .group { margin-bottom: 14px; }
  .group h3 { font-size: 12px; font-weight: 600; color: var(--muted); margin: 0 0 6px; }
  .scard { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
  .scard.active { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent) inset; }
  .shead { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .stitle { font-weight: 600; font-size: 14px; }
  .tagl { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 6px; padding: 0 5px; flex: none; }
  .slook { font-size: 13px; color: var(--muted); margin: 4px 0 8px; }
  .srow { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
  .smeta { font-size: 12px; color: var(--muted); }

  .btn { border: 0; border-radius: 8px; padding: 7px 14px; background: var(--accent); color: var(--accent-ink); cursor: pointer; font-weight: 600; }
  .btn.small { padding: 4px 11px; font-size: 13px; }
  .ghost { border: 1px solid var(--line); border-radius: 8px; padding: 5px 10px; background: var(--panel); cursor: pointer; font-size: 13px; }
  .ghost[aria-pressed="true"] { border-color: var(--escalate); color: var(--escalate); }
  button:disabled { opacity: .5; cursor: default; }

  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, select { width: 100%; padding: 8px 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
  .row { display: flex; gap: 10px; flex-wrap: wrap; } .row > div { flex: 1 1 170px; }
  .err { color: var(--escalate); font-size: 13px; margin-top: 8px; min-height: 1em; }

  .sessbar { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap;
             padding-bottom: 10px; border-bottom: 1px solid var(--line); margin-bottom: 10px; }
  .sessbtns { display: flex; gap: 6px; flex-wrap: wrap; }
  .muted { color: var(--muted); font-size: 13px; }

  .steps { background: var(--soft); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .steps-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 13px; }
  .steps ol { margin: 8px 0 0; padding-left: 20px; }
  .steps li { margin: 6px 0; font-size: 13.5px; }
  .step-line { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
  .quote { font-style: italic; }
  .res-ok { color: var(--ok); font-weight: 600; } .res-bad { color: var(--escalate); font-weight: 600; }

  #log { display: flex; flex-direction: column; gap: 10px; min-height: 120px; max-height: calc(100vh - 330px); overflow-y: auto; padding: 2px; }
  @media (max-width: 780px) { #log { max-height: 60vh; } }
  .msg { padding: 9px 12px; border-radius: 10px; max-width: 94%; }
  .me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); white-space: pre-wrap; }
  .bot { align-self: flex-start; background: var(--bg); border: 1px solid var(--line); }
  .mtext { white-space: pre-wrap; }
  .mmeta { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; color: var(--muted); margin-top: 6px; }
  .badge { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 99px; color: #fff; }
  .d-AUTO_RESOLVE { background: var(--ok); } .d-CLARIFY { background: var(--clarify); } .d-ABSTAIN { background: var(--abstain); }
  .d-ESCALATE { background: var(--escalate); } .d-REAUTH_REQUIRED { background: var(--reauth); }
  @media (prefers-color-scheme: dark) { .badge { color: #0d1110; } }
  .linkbtn { border: 0; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12px; font-weight: 600; text-decoration: underline; }
  .why { margin-top: 8px; border-top: 1px dashed var(--line); padding-top: 8px; font-size: 13px; }
  .why dl, .ticket dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 4px 10px; margin: 0; }
  .why dt, .ticket dt { color: var(--muted); font-size: 12px; padding-top: 1px; }
  .why dd, .ticket dd { margin: 0; overflow-wrap: anywhere; }
  @media (max-width: 480px) { .why dl, .ticket dl { grid-template-columns: minmax(0, 1fr); } .why dt, .ticket dt { padding-top: 6px; } }
  .codebox { display: block; background: var(--code); border-radius: 6px; padding: 4px 8px; white-space: pre-wrap; }
  .never { margin: 8px 0 0; font-size: 12px; color: var(--muted); }
  .chk-ok { color: var(--ok); } .chk-bad { color: var(--escalate); }
  .plainlist { margin: 0; padding-left: 18px; }

  .chips { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
  .chip { font-size: 13px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 99px; background: var(--panel); cursor: pointer; }
  form.send { display: flex; gap: 8px; margin-top: 10px; }

  .ticket { background: var(--panel); border: 1px solid var(--line); border-left: 4px solid var(--escalate); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; }
  .ticket.fresh { box-shadow: 0 0 0 2px var(--escalate); }
  .ticket.trace { border-left-color: var(--ok); } .ticket.trace.fresh { box-shadow: 0 0 0 2px var(--ok); }
  .bankh { font-size: 12px; font-weight: 600; color: var(--muted); margin: 10px 0 6px; }
  .thead { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin-bottom: 8px; font-size: 13px; }
  .q { font-weight: 700; }
  .prio { font-size: 11px; font-weight: 700; border-radius: 6px; padding: 0 6px; border: 1px solid currentColor; }
  .p-Critical, .p-High { color: var(--escalate); } .p-Medium { color: var(--abstain); } .p-Low { color: var(--muted); }
  .ticket dd.wide { grid-column: 1 / -1; }
  .ev { width: 100%; border-collapse: collapse; font-size: 12px; }
  .ev th, .ev td { text-align: left; padding: 2px 4px; border-bottom: 1px solid var(--line); vertical-align: top; overflow-wrap: normal; }
  .ev .nw { white-space: nowrap; }
  .ev tr.flag td { color: var(--escalate); font-weight: 600; }
  .evwrap { overflow-x: auto; }
  details > summary { cursor: pointer; }
  pre.json { margin: 4px 0 0; font-size: 12px; background: var(--code); border-radius: 6px; padding: 6px 8px; overflow-x: auto; max-height: 220px; }
  .empty { color: var(--muted); font-size: 13px; border: 1px dashed var(--line); border-radius: 10px; padding: 14px; text-align: center; }
  footer { max-width: 1480px; margin: 0 auto; padding: 0 16px 24px; color: var(--muted); font-size: 12px; }

  dialog#dq { width: min(1100px, calc(100vw - 32px)); max-height: calc(100vh - 32px); padding: 0; border: 1px solid var(--line);
              border-radius: 14px; background: var(--panel); color: var(--ink); }
  dialog#dq::backdrop { background: rgb(0 0 0 / .45); }
  @media (max-width: 780px) { dialog#dq { width: 100%; max-width: 100%; height: 100%; max-height: 100%; margin: 0; border: 0; border-radius: 0; } }
  .dq-head { position: sticky; top: 0; z-index: 1; display: flex; justify-content: space-between; align-items: center; gap: 10px;
             padding: 14px 16px 10px; background: var(--panel); border-bottom: 1px solid var(--line); }
  #dq h2 { font-size: 17px; margin: 0; line-height: 1.3; }
  .dq-body { padding: 4px 16px 18px; }
  .dq-body h3 { font-size: 14px; margin: 20px 0 2px; }
  .dq-body .hint { margin: 0 0 8px; }
  .dq-body .lead { margin-top: 10px; }
  .kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 8px; margin: 12px 0 4px; }
  .kpi { background: var(--soft); border-radius: 10px; padding: 8px 10px; min-width: 0; }
  .kpi span { display: block; font-size: 12px; color: var(--muted); }
  .kpi b { display: block; font-size: 16px; overflow-wrap: anywhere; }
  .tablewrap { overflow-x: auto; }
  table.dqt { width: 100%; border-collapse: collapse; font-size: 13px; }
  @media (max-width: 780px) { table.dqt { min-width: 680px; } }  /* scroll sideways instead of squeezing the columns */
  table.dqt th, table.dqt td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  table.dqt th { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
  table.dqt .num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  table.dqt .rule code { white-space: normal; overflow-wrap: anywhere; font-size: 12px; }
  .sub2 { display: block; color: var(--muted); font-size: 12px; }
  .sev { font-size: 11px; font-weight: 700; border: 1px solid currentColor; border-radius: 6px; padding: 0 6px; white-space: nowrap; }
  .sev-error, .bad { color: var(--escalate); } .sev-warn { color: var(--abstain); }
</style>
</head>
<body>
<header class="top">
  <div class="brand">
    <div class="logo" aria-hidden="true">LB</div>
    <div>
      <h1 data-t="title"></h1>
      <p class="sub" data-t="subtitle"></p>
    </div>
  </div>
  <div class="top-actions">
    <button type="button" class="ghost demo-only" id="btnDq" aria-haspopup="dialog" data-t="dqButton"></button>
    <span id="modelStatus" class="pill" role="status"></span>
    <div class="lang" role="group" aria-label="Language">
      <button type="button" data-lang="en" aria-pressed="true">EN</button>
      <button type="button" data-lang="es" aria-pressed="false">ES</button>
    </div>
  </div>
</header>
<p class="promise" data-t="promise"></p>

<main class="layout plain" id="layout">
  <aside class="col scen" id="scenCol" hidden aria-labelledby="scenH">
    <h2 id="scenH" data-t="scenarios"></h2>
    <p class="hint" data-t="howto"></p>
    <div id="scenList"></div>
  </aside>

  <section class="col" aria-labelledby="chatH">
    <h2 id="chatH" data-t="chatTitle"></h2>
    <div class="card" id="signin">
      <p class="hint" data-t="signinHint"></p>
      <div class="row">
        <div><label for="cid" data-t="customer"></label><select id="cid"></select></div>
        <div><label for="pin" data-t="pin"></label><input id="pin" inputmode="numeric" maxlength="6" autocomplete="off"></div>
      </div>
      <div style="margin-top:12px"><button class="btn" id="go" data-t="signIn"></button></div>
      <div class="err" id="lerr" role="alert"></div>
    </div>

    <div class="card" id="chat" hidden>
      <div class="sessbar">
        <div><strong id="who"></strong> <span id="ttl" class="muted"></span></div>
        <div class="sessbtns">
          <button type="button" class="ghost demo-only" id="btnExpire" data-t="expire"></button>
          <button type="button" class="ghost demo-only" id="btnOutage" aria-pressed="false" data-t="outage"></button>
          <button type="button" class="ghost" id="btnAgain" hidden data-t="signInAgain"></button>
          <button type="button" class="ghost" id="btnOut" data-t="signOut"></button>
        </div>
      </div>
      <div class="steps" id="steps" hidden></div>
      <div id="log" aria-live="polite"></div>
      <div class="chips" id="chips"></div>
      <form class="send" id="f">
        <input id="m" maxlength="1000" autocomplete="off" aria-label="Message">
        <button class="btn" id="send" data-t="send"></button>
      </form>
    </div>
  </section>

  <aside class="col bank" id="bankCol" hidden aria-labelledby="bankH">
    <h2 id="bankH" data-t="bank"></h2>
    <p class="hint" data-t="bankHint"></p>
    <div id="tickets"></div>
  </aside>
</main>
<footer data-t="footer"></footer>

<dialog id="dq" aria-labelledby="dqH">
  <div>
    <div class="dq-head">
      <h2 id="dqH" data-t="dqTitle"></h2>
      <button type="button" class="ghost" id="dqClose" data-t="close"></button>
    </div>
    <div class="dq-body">
      <p class="hint lead" data-t="dqHint"></p>
      <div id="dqBody"></div>
    </div>
  </div>
</dialog>

<script>

    else if (v === true) el.setAttribute(k, ""); else el.setAttribute(k, v);

}

// ---------- scenarios ----------

        h("p", { class: "slook" }, s.look_for[state.lang]),

          h("button", { type: "button", class: "btn small", disabled: state.busy || undefined, onclick: () => runScenario(s) }, active ? t().running : t().run))));

    let res = null;
    if (got) res = (!exp || exp === got) ? h("span", { class: "res-ok" }, "✓ " + t().disp[got])
                                           : h("span", { class: "res-bad" }, `✗ ${t().got} ${t().disp[got] || got}`);
    ol.append(h("li", {}, h("div", { class: "step-line" },
      h("span", { class: "quote" }, `“${turn}”`), h("span", { class: "muted" }, expText), res,
      i === next ? h("button", { type: "button", class: "btn small", disabled: state.busy || undefined, onclick: () => sendStep() }, t().sendStep) : null)));
  });

      h("button", { type: "button", class: "ghost", onclick: () => { state.active = null; paintSteps(); paintScenarios(); paintChips(); } }, t().close))), ol);

async function runScenario(s) {

  const ok = await signIn(s.customer_id, s.test_pin);

  state.active = s; state.turns = [];
  if (s.fault) await applyFault(s.fault);
  paintScenarios(); paintSteps(); paintChips();
  const top = $("#chat").getBoundingClientRect().top;

}
async function sendStep() {
  const s = state.active;

}

    await new Promise(res => setTimeout(res, 600));

function notify(msg) {  // where the person is looking: the chat if it is open, else the sign-in card

}
async function signIn(customerId, pin) {

  if (!r.ok) { notify(r.status === 429 ? t().errRate : ((r.data && r.data.detail) || t().errGeneric)); return false; }
  Object.assign(state, { token: r.data.token, customer: customerId, pin, deadline: Date.now() + r.data.expires_in * 1000,
                         expired: false, modelDown: false, active: null, turns: [] });
  $("#signin").hidden = true; $("#chat").hidden = false; $("#btnAgain").hidden = true;
  $("#who").textContent = customerId;

}
function signOut() {
  Object.assign(state, { token: null, customer: null, pin: null, active: null, turns: [], modelDown: false });
  $("#chat").hidden = true; $("#signin").hidden = false; $("#log").replaceChildren(); lastTickets = []; lastTraces = [];

}
async function applyFault(fault) {
  const r = await api("POST", "/demo/fault", { session_token: state.token, fault });
  if (!r.ok) return;
  if (fault === "expire_session") { state.expired = true; state.deadline = Date.now(); }
  if (fault === "llm_outage") state.modelDown = true;

}
function tick() {

  const expired = state.expired || left === 0;
  $("#ttl").textContent = expired ? `· ${t().expired}` : `· ${t().expiresIn} ${Math.floor(left / 60)}:${String(left % 60).padStart(2, "0")}`;
  $("#btnExpire").disabled = expired;

setInterval(tick, 1000);

let dqData = null;
const locale = () => (state.lang === "es" ? "es" : "en");
const fmtN = n => (n === null || n === undefined) ? "—" : Number(n).toLocaleString(locale());
const fmtPct = r => {  // one decimal; a rate that is not 0 or 1 never rounds to "0.0%" or "100.0%"
  if (r === null || r === undefined) return "—";
  if (r > 0 && r < 0.0005) return `<${(0.1).toLocaleString(locale(), { minimumFractionDigits: 1 })}%`;
  if (r < 1 && r >= 0.9995) return `>${(99.9).toLocaleString(locale(), { minimumFractionDigits: 1 })}%`;
  return `${(100 * r).toLocaleString(locale(), { minimumFractionDigits: 1, maximumFractionDigits: 1 })}%`;
};
const kpi = (label, value) => h("div", { class: "kpi" }, h("span", {}, label), h("b", {}, value));
function dqTable(head, rows) {
  return h("div", { class: "tablewrap" }, h("table", { class: "dqt" },
    h("thead", {}, h("tr", {}, head.map(([c, num]) => h("th", { scope: "col", class: num ? "num" : null }, c)))), h("tbody", {}, rows)));
}
function checksTable(list) {
  const L = t().dq;
  if (!list.length) return h("p", { class: "muted" }, L.allPassed);
  return dqTable([[L.table], [L.check], [L.severity], [L.failedTotal, true], [L.rate, true], [L.rule]], list.map(c => h("tr", {},
    h("td", {}, c.table), h("td", {}, h("code", {}, c.check)), h("td", {}, h("span", { class: "sev sev-" + c.severity }, L.sev[c.severity] || c.severity)),
    h("td", { class: "num" }, `${fmtN(c.failed)} / ${fmtN(c.total)}`), h("td", { class: "num" }, fmtPct(c.rate)),
    h("td", { class: "rule" }, c.detail ? h("code", {}, c.detail) : "—"))));
}
function loadParams(load) {  // what shaped the load: a sample, a date range, a single day
  return Object.entries(load.params || {})
    .filter(([k, v]) => v !== null && v !== false && k !== "sample_mode" && (k !== "lookback_days" || load.mode === "incremental"))
    .map(([k, v]) => `${k}=${v}`).join(" · ");
}
async function openDq() {
  $("#dq").showModal();
  if (!dqData) {
    $("#dqBody").replaceChildren(h("p", { class: "muted" }, t().dq.loading));
    const r = await api("GET", "/demo/data_quality");
    if (!r.ok) { $("#dqBody").replaceChildren(h("p", { class: "err" }, t().dq.failed)); return; }
    dqData = r.data;
  }
  paintDq();
}
function paintDq() {
  if (!dqData || !$("#dq").open) return;
  const L = t().dq, { served, freshness: f, full_run: full, contract } = dqData;
  const body = [
    h("div", { class: "kpis" },
      kpi(L.asOf, f.as_of || "—"), kpi(L.loaded, f.loaded_at ? f.loaded_at.slice(0, 16) : "—"),
      kpi(L.checksRun, fmtN(served.checks.run)), kpi(L.failedChecks, `${served.checks.errors_failed} · ${served.checks.warnings_failed}`),
      kpi(L.slo, (f.enforced ? L.sloOn : L.sloOff)(fmtN(f.slo_hours)))),
    h("h3", {}, L.servedTitle), h("p", { class: "hint" }, L.servedHint),
    dqTable([[L.table], [L.rows, true], [L.partitions], [L.lastLoad], [L.loads, true], [L.contract]], served.tables.map(tb => {
      const ld = tb.last_load, p = tb.partitions, params = ld ? loadParams(ld) : "";
      return h("tr", {},
        h("td", {}, h("code", {}, tb.table)), h("td", { class: "num" }, fmtN(tb.rows)),
        h("td", {}, p ? `${fmtN(p.n)} · ${p.first} → ${p.last}` : "—"),
        h("td", {}, ld ? [h("code", {}, ld.mode), " · ", L.staged(fmtN(ld.rows_staged), fmtN(ld.rows_quarantined), fmtN(ld.rows_deduplicated)),
                          params ? h("span", { class: "sub2 mono" }, params) : null] : "—"),
        h("td", { class: "num" }, fmtN(tb.loads), " · ", h("span", { class: tb.failed_loads ? "bad" : null }, fmtN(tb.failed_loads))),
        h("td", {}, ld ? ld.contract_version : "—"));
    })),
    h("h3", {}, L.failedTitle), checksTable(served.checks.failed),
  ];
  if (full) {
    const rowsRead = Object.values(full.tables).reduce((a, x) => a + x.rows_staged, 0);
    body.push(h("h3", {}, L.fullTitle), h("p", { class: "hint" }, L.fullHint),
      h("div", { class: "kpis" },
        kpi(L.run, `${full.run_id} · ${full.generated_at.slice(0, 10)}`), kpi(L.rowsRead, fmtN(rowsRead)),
        kpi(L.checksRun, fmtN(full.summary.checks_run)), kpi(L.failedChecks, `${full.summary.errors_failed} · ${full.summary.warnings_failed}`)),
      dqTable([[L.table], [L.rowsRead, true], [L.files, true], [L.quarantined, true], [L.duplicates, true]],
        Object.entries(full.tables).map(([name, x]) => h("tr", {}, h("td", {}, h("code", {}, name)), h("td", { class: "num" }, fmtN(x.rows_staged)),
          h("td", { class: "num" }, fmtN(x.partitions)), h("td", { class: "num" }, fmtN(x.rows_quarantined)), h("td", { class: "num" }, fmtN(x.rows_deduplicated))))),
      h("h3", {}, L.fullFailedTitle), checksTable(full.failed_checks));
  }
  body.push(h("h3", {}, L.contractTitle), h("p", { class: "hint" }, L.contractHint(contract.version)),
    dqTable([[L.column], [L.dictionary], [L.observed], [L.decision]], contract.deviations.map(d => h("tr", {},
      h("td", {}, h("code", {}, `${d.table}.${d.column}`)), h("td", {}, h("code", {}, d.dictionary)), h("td", {}, d.observed), h("td", {}, d.decision)))),
    h("h3", {}, L.policyTitle), h("ul", { class: "plainlist" }, L.policy.map(x => h("li", {}, x))));
  $("#dqBody").replaceChildren(...body);
}

// ---------- wiring ----------
document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => { state.lang = b.dataset.lang; store.set("demo.lang", state.lang); paintStatic(); tick(); }));
$("#btnDq").addEventListener("click", openDq);
$("#dqClose").addEventListener("click", () => $("#dq").close());
$("#dq").addEventListener("click", e => { if (e.target === $("#dq")) $("#dq").close(); });  // a click on the backdrop
$("#f").addEventListener("submit", e => { e.preventDefault(); send($("#m").value); });
$("#go").addEventListener("click", () => signIn($("#cid").value.trim(), $("#pin").value.trim()));
$("#btnOut").addEventListener("click", signOut);
$("#btnExpire").addEventListener("click", () => applyFault("expire_session"));
$("#btnOutage").addEventListener("click", () => applyFault(state.modelDown ? "llm_restore" : "llm_outage"));
$("#btnAgain").addEventListener("click", () => signIn(state.customer, state.pin));

(async function init() {
  const [health, scen, customers] = await Promise.all([api("GET", "/health"), api("GET", "/demo/scenarios"), api("GET", "/demo/customers")]);
  state.providers = (health.ok && health.data.llm_providers_configured) || [];
  state.demo = scen.ok;
  state.scenarios = scen.ok ? scen.data : [];
  $("#scenCol").hidden = !state.demo; $("#bankCol").hidden = !state.demo;
  $("#layout").classList.toggle("plain", !state.demo);
  document.querySelectorAll(".demo-only").forEach(el => { el.hidden = !state.demo; });
  const sel = $("#cid");
  const list = customers.ok ? customers.data : [];
  if (!list.length) { sel.replaceWith(h("input", { id: "cid", placeholder: "CLI-…", autocomplete: "off" })); }
  else {
    list.forEach(c => sel.append(h("option", { value: c.customer_id, "data-pin": c.test_pin }, c.customer_id)));
    const fill = () => { $("#pin").value = sel.selectedOptions[0].dataset.pin; };
    sel.addEventListener("change", fill); fill();
  }
  paintStatic();
})();
</script>
</body>
</html>
