# Render Blueprint for the jury demo (https://render.com/docs/blueprint-spec): one Docker web service with a
# persistent disk for the warehouse, tickets and traces. Values marked `sync: false` are asked for when the
# Blueprint is created (Render ignores them on later syncs). Put a spend limit on the model key at the provider;
# LLM_DAILY_BUDGET_USD is a second, in-process cap. Steps and checks: docs/operations.md.
services:
  - type: web
    name: x-payments-agent
    runtime: docker
    dockerfilePath: ./ops/Dockerfile
    dockerContext: .
    plan: 0.5c-512mb        # paid: it never sleeps while the jury tries it, and a disk needs a paid instance
    region: oregon
    healthCheckPath: /readyz  # readiness: the warehouse and the state store answer (/livez is the bare process check)
    autoDeployTrigger: "off"  # deploy by hand: a push must not restart the instance while the jury is using it
    disk:
      name: warehouse
      mountPath: /app/data/warehouse
      sizeGB: 1
    envVars:
      - key: DEMO_MODE
        value: "1"
      # Sessions and conversations live on the disk, so a restart or a deploy keeps a customer's case in flight.
      - key: STATE_DB_PATH
        value: /app/data/warehouse/state.sqlite
      - key: DEMO_IDP_SECRET
        generateValue: true
      - key: ADMIN_API_KEY
        generateValue: true
      - key: OPERATOR_KEYS
        sync: false           # nombre=clave,nombre=clave (se pide al crear el Blueprint)
      - key: METRICS_TOKEN    # the bearer a Prometheus scraper presents at /metrics (it opens nothing else)
        generateValue: true
      - key: SECURITY_HSTS    # Render serves only HTTPS
        value: "1"
      - key: RETENTION_INTERVAL_HOURS  # the container purges expired records daily (docs/operations.md, "Data retention")
        value: "24"
      # The real client address on Render: set by its Cloudflare edge, unforgeable; Render sends no X-Forwarded-For.
      - key: CLIENT_IP_HEADER
        value: CF-Connecting-IP
      - key: LOGIN_RATE_PER_MIN
        value: "30"           # every guided scenario opens a session
      - key: CHAT_RATE_PER_MIN
        value: "20"
      - key: LLM_DAILY_BUDGET_USD
        value: "5"
      - key: LLM_PROVIDERS
        value: anthropic,groq
      - key: ANTHROPIC_MODEL
        value: claude-sonnet-5
      - key: ANTHROPIC_EFFORT
        value: low
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      # The organizer's dataset (read-only S3; values from their data dictionary). Without them, set
      # INGEST_ARGS to "--profile serving --source local --raw-dir /app/tests/fixtures/raw" (the hand-made fixture).
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: DATASET_BUCKET
        sync: false
      - key: AWS_DEFAULT_REGION
        value: us-east-2
      - key: INGEST_ARGS
        value: --profile serving --sample-customers 5000 --since 2025-06-17
      # The first boot's load on this 512 MB instance: DuckDB's cap plus the Python process (about 170 MB) must fit, and
      # each DuckDB thread holds its own CSV buffers. With the image's 400MB and every core the load was killed for memory
      # (2026-09-29); measurements in docs/operations.md, "Deploy (container)".
      - key: DUCKDB_THREADS
        value: "1"
      - key: DUCKDB_MEMORY_LIMIT
        value: 192MB

  # The web the jury uses (web/, TanStack Start served by web/serve.mjs): the customer chat and the operator console. It
  # calls the API above at its public URL. Neither URL is a secret. WEB_PUBLIC_ORIGIN must be exactly the address the
  # browser sees: the operator forms refuse posts from any other origin, and an https origin gives Secure cookies.
  # Behind the API's edge every web user arrives from this service's address, so the API's per-client limits (logins,
  # failed keys) count the web's users together; a private API behind the web would count them one by one.
  - type: web
    name: cecil-ai
    runtime: docker
    dockerfilePath: ./ops/Dockerfile.web
    dockerContext: ./web
    plan: 0.5c-512mb        # paid: it never sleeps while the jury tries it
    region: oregon
    healthCheckPath: /_healthz
    autoDeployTrigger: "off"  # deploy by hand, like the API
    envVars:
      - key: AGENT_API_URL
        value: https://x-payments-agent.onrender.com
      - key: WEB_PUBLIC_ORIGIN
        value: https://cecil-ai.onrender.com
      # The end user's address, set by Render's Cloudflare edge and unforgeable (the API reads the same header)
      - key: TRUSTED_CLIENT_IP_HEADER
        value: CF-Connecting-IP
