# A Prometheus for the local compose stack (docker compose --profile monitoring ...; make monitoring-up). In a real
# deployment the same scrape job and rule file go into the platform's Prometheus.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: cecilai-api
    metrics_path: /metrics
    authorization:
      type: Bearer
      credentials_file: /tmp/metrics_token   # written from METRICS_TOKEN by the compose service, never committed
    static_configs:
      - targets: ["api:8000"]
