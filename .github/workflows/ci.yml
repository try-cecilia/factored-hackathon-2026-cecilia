name: ci

# Jobs run in parallel and each is cached:
#   python     the hermetic suite (which includes the resilience tests, `make test-resilience` is a subset of it), the classifier
#              evaluation, the quality gate (eval.gate) and the data/ML validation (`make gate` runs `make validate-data-ml`), and
#              a check that none of that rewrote a versioned file
#   web        the frontend's locked install, typecheck, build and every test (`pnpm test:all`: node:test, vitest on the DOM,
#              and HTTP tests against the production build)
#   alerts     promtool over ops/alerts.yml and its unit tests
#   container  the API image booted the way Render does (existing checks)
#   web-image  the web image builds, runs unprivileged and answers
#   compose    the whole stack (API + web + Prometheus) from scratch on the fixture warehouse: ops/compose_e2e.sh
# Checks that other branches add (per-category floors in eval.gate) come in through `make` targets: `make gate` runs whatever
# eval.gate checks. The versioned evidence is regenerated on purpose (`make evidence`, `make eval ...`), never by a CI run.

# Triggers: a push to main (verifies each commit that lands), every pull request whatever its base branch (a branch with an open PR
# runs once, not once per event), and by hand on a branch without a PR. Only a pull request run is cancelled by a newer one, and
# only by one of the same PR. A concurrency group holds one active and one pending run, and a third run cancels the pending one
# even without cancel-in-progress, so every run that is not a PR gets its own group (run_id): each commit of main is verified,
# and a manual run never replaces a push.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
          cache: pip
          cache-dependency-path: requirements-tracking.txt
      - name: The lock files match the pins they were compiled from
        run: make lock-check
      - name: Install the locked dependencies (exact versions, every wheel checked against its sha256)
        run: pip install --require-hashes -r requirements-tracking.txt  # the serving lock plus mlflow, so the tracking tests run
      - name: Hermetic test suite (fixture warehouse, no S3, no API keys)
        run: make test
      - name: Quality gate (safety floors, guard recall, evidence made with the current prompt)
        if: hashFiles('eval/reports/system_eval.json') != ''  # the public copy carries no per-case report (dataset ids): the team's repository runs it
        run: make gate
      - name: Intent classifier evaluation is reproducible (its report and model go to a temporary directory, not over the versioned ones)
        run: |
          out="$RUNNER_TEMP/intent-classifier"
          python -m eval.evaluate_intent_classifier --out-dir "$out" > /dev/null
          python - <<'EOF'
          import json, os
          r = json.load(open(os.environ["RUNNER_TEMP"] + "/intent-classifier/intent_classifier.json"))
          t = r["test"]
          learned, base = t["learned"]["accuracy"]["rate"], t["baseline_keywords"]["accuracy"]["rate"]
          guard = t["escalation_guard"]["lexicon_or_classifier (runtime)"]
          print(f"learned={learned} baseline={base} guard_recall={guard['recall']['rate']} false_esc={guard['false_escalation']['rate']}")
          assert learned > base, "learned classifier no longer beats the keyword baseline"
          assert guard["false_escalation"]["rate"] <= 0.05
          EOF
      - name: Nothing versioned was rewritten (the last step, so it covers the suite, the gate, the validation and the evaluation above)
        run: |
          git status --porcelain
          test -z "$(git status --porcelain)" || { git --no-pager diff --stat; echo "a CI step rewrote a versioned file"; exit 1; }

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json  # the pnpm version comes from "packageManager"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - name: Unit tests (node:test), component tests (vitest, DOM) and HTTP tests against the production build
        run: pnpm test:all

  # A known vulnerability in a locked dependency fails the build: pip-audit over the hash-pinned serving lock (the packages are
  # already pinned, so it resolves nothing) and pnpm over the web's production tree. An advisory published tomorrow can turn this
  # red without any change here: bump the pin, or record why it does not apply, in the PR that fixes it.
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version-file: .python-version
      - name: Known vulnerabilities in the locked Python dependencies
        run: pip install pip-audit==2.10.1 && pip-audit -r requirements.txt --disable-pip --no-deps
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          package_json_file: web/package.json
      - name: Known vulnerabilities in the web's production dependencies (high and critical)
        working-directory: web
        run: pnpm audit --prod --audit-level high

  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Alert rules and their unit tests (promtool)
        run: make alerts-check

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Build the image
        run: docker build -f ops/Dockerfile -t x-payments-agent .
      - name: Boot it as on Render (disk mounted owned by root, its own PORT), on the fixture warehouse
        run: |
          sudo mkdir -p /srv/disk && sudo chown root:root /srv/disk && sudo chmod 755 /srv/disk
          docker run -d --name app -p 8000:10000 -e PORT=10000 -v /srv/disk:/app/data/warehouse \
            -e DEMO_MODE=1 -e DEMO_IDP_SECRET=ci-secret -e ADMIN_API_KEY=ci-admin \
            -e INGEST_ARGS="--profile serving --source local --raw-dir /app/tests/fixtures/raw" \
            x-payments-agent
          for i in $(seq 1 90); do curl -fs localhost:8000/health && break; sleep 2; done
          curl -fs localhost:8000/health | grep -q '"data_as_of":"2024-01-16"'
      - name: Smoke test, with no model key (only what needs none)
        run: python3 ops/container_smoke.py http://localhost:8000
      - name: The app runs unprivileged, owns its data, and the disk survives a restart without re-ingesting
        run: |
          user=$(docker top app -o pid,user,args | awk '/uvicorn/ {print $2; exit}')
          echo "uvicorn runs as: $user" && test -n "$user" && test "$user" != "root"
          test "$(sudo stat -c %u /srv/disk/bank.duckdb)" = "10001"
          loaded=$(sudo python3 -c "import json; print(json.load(open('/srv/disk/quality_report.json'))['run_id'])")
          docker restart app
          for i in $(seq 1 60); do curl -fs localhost:8000/health && break; sleep 2; done
          test "$(docker logs app 2>&1 | grep -c 'ingesting with')" = "1"
          shown=$(curl -fs -H "X-Admin-Key: ci-admin" localhost:8000/admin/data_quality | python3 -c "import json, sys; print(json.load(sys.stdin)['run_id'])")
          echo "quality report on the disk: $loaded; /admin/data_quality after the restart: $shown"
          test -n "$loaded" && test "$loaded" = "$shown"
          python3 ops/container_smoke.py http://localhost:8000
      - name: A first load that fails or is killed leaves nothing a later boot would serve, and the next boot loads again
        run: |
          sudo mkdir -p /srv/bad && sudo chown root:root /srv/bad
          if docker run --rm -v /srv/bad:/app/data/warehouse -e DEMO_IDP_SECRET=ci-secret \
               -e INGEST_ARGS="--profile serving --source local --raw-dir /app/no-such-dir" x-payments-agent; then
            echo "the boot should have failed" && exit 1
          fi
          for f in bank.duckdb bank.duckdb.wal bank.duckdb.building; do sudo test ! -e /srv/bad/$f; done
          # What a boot killed half way through its load leaves: a partial build under the temporary name, a stale WAL
          sudo sh -c 'echo partial > /srv/bad/bank.duckdb.building && echo stale > /srv/bad/bank.duckdb.wal'
          docker run -d --name retry -p 8001:10000 -e PORT=10000 -v /srv/bad:/app/data/warehouse -e DEMO_IDP_SECRET=ci-secret \
            -e INGEST_ARGS="--profile serving --source local --raw-dir /app/tests/fixtures/raw" x-payments-agent
          for i in $(seq 1 90); do curl -fs localhost:8001/health && break; sleep 2; done
          curl -fs localhost:8001/health | grep -q '"data_as_of":"2024-01-16"' || { docker logs retry; exit 1; }
          sudo test -f /srv/bad/bank.duckdb && sudo test ! -e /srv/bad/bank.duckdb.building && sudo test ! -e /srv/bad/bank.duckdb.wal
          docker rm -f retry
      - name: Retention runs on its schedule, records itself in the audit log and shows in /metrics
        run: |
          docker logs app 2>&1 | grep -q "retention loop started"
          for i in $(seq 1 30); do docker exec app test -s /app/data/warehouse/retention_status.json && break; sleep 1; done
          curl -fs -H "X-Admin-Key: ci-admin" "localhost:8000/admin/audit_log?limit=500" | grep -Eq '"event": ?"retention_purge"'
          docker exec app python -m ops.retention --dry-run
          curl -fs -H "X-Admin-Key: ci-admin" localhost:8000/metrics | grep -E '^cecilai_retention_last_run_timestamp_seconds [1-9]'
      - name: Container logs
        if: always()
        run: docker logs app

  web-image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the web image (layers cached in the Actions cache)
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: web
          file: ops/Dockerfile.web
          load: true
          tags: cecilai-web
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,scope=web-image,mode=max
      - name: It runs unprivileged, answers, and takes its API address at run time
        run: |
          docker run -d --name web -p 3000:3000 -e AGENT_API_URL=http://127.0.0.1:1 cecilai-web
          for i in $(seq 1 30); do curl -fs localhost:3000/_healthz && break; sleep 1; done
          test "$(docker exec web id -u)" != "0"
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:3000/)" = 200
          # no API behind it: the page still loads and the health route says so, instead of hanging or crashing
          curl -s localhost:3000/api/agent/health | grep -q '"status":"unavailable"'
      - name: Container logs
        if: always()
        run: docker logs web

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: The compose file resolves with nothing configured
        run: |
          docker compose -f ops/docker-compose.yml config -q
          # every profile resolves; the heavy one (llm-local: a model server) is validated here and not started
          docker compose -f ops/docker-compose.yml --profile monitoring --profile llm-local config -q
          docker compose -f ops/docker-compose.yml -f ops/docker-compose.gpu.yml --profile llm-local config -q
      - name: The stack from scratch on the fixture (no S3, no model keys), checked end to end
        run: make compose-e2e

